spring.application.name=GatewayService

server.port=8090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

# Maximum number of recent calls considered when calculating the failure rate.
# Here, the window can contain up to 6 calls; evaluation does NOT have to wait for all 6.
resilience4j.circuitbreaker.instances.paymentService.slidingWindowSize=6

# Minimum number of recorded calls required before failure-rate evaluation can begin.
# Here, evaluation starts after 4 calls; if the threshold is reached, the circuit can open immediately.
resilience4j.circuitbreaker.instances.paymentService.minimumNumberOfCalls=4

# Open circuit when failure rate reaches 50%
resilience4j.circuitbreaker.instances.paymentService.failureRateThreshold=50

# Keep circuit OPEN for 10 seconds
resilience4j.circuitbreaker.instances.paymentService.waitDurationInOpenState=10s

# Allow 4 test calls in HALF_OPEN state
resilience4j.circuitbreaker.instances.paymentService.permittedNumberOfCallsInHalfOpenState=2

# Use call count, rather than time, to measure the sliding window
resilience4j.circuitbreaker.instances.paymentService.slidingWindowType=COUNT_BASED